<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JIYORA | Fashion Wanita</title>
<meta name="description" content="JIYORA: fashion wanita yang nyaman dipakai sehari-hari.">
<link rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#03664B;--gd:#06382B;--bg:#F5F7F4;--ink:#12231D;--mut:#5E6F67;--line:#DCE4DF;--pk:#D63A5F;--pkl:#FCE7EC}
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:0 16px}
.mut{color:var(--mut)}
.demo{background:var(--gd);color:#fff;font-size:13px;text-align:center;padding:6px 12px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:.14em;color:var(--g)}
.lg{width:34px;height:26px;background:var(--mg) center/contain no-repeat}
nav{display:flex;gap:4px;overflow-x:auto;order:3;width:100%}
nav a{padding:6px 14px;border-radius:99px;font-weight:500;white-space:nowrap;color:var(--mut)}
nav a.on{background:var(--g);color:#fff}
.acct{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px}
.acct .btn.o{color:var(--g)}
@media(min-width:760px){nav{order:0;width:auto;margin-left:24px}}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 22px;font:700 15px Figtree,sans-serif;cursor:pointer;background:var(--g);color:#fff;text-align:center}
.btn.o{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hero{background:var(--g);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:50%;width:min(62vw,480px);aspect-ratio:1.3;transform:translateY(-50%);background:var(--mw) center/contain no-repeat;opacity:.13}
.hero .wrap{position:relative;z-index:1;padding-top:56px;padding-bottom:64px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.02;font-weight:800;max-width:11em}
.hero p{margin:16px 0 28px;max-width:30em;opacity:.92}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn:not(.o){background:#fff;color:var(--g)}
section{padding:36px 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:clamp(22px,4vw,30px);line-height:1.15}
.sh>a{color:var(--g);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card:hover{border-color:var(--g)}
.im{aspect-ratio:3/4;position:relative;overflow:hidden;background:hsl(var(--h,150) 28% 90%)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.ph::before{content:"";position:absolute;inset:0;background:var(--mg) center/46% no-repeat;opacity:.3}
.tag{position:absolute;left:8px;top:8px;background:var(--pk);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.r{background:var(--g)}
.ci{padding:10px 12px 12px}
.ci h3{font:600 15px/1.3 Figtree,sans-serif}
.pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:4px}
.pr b{font-size:16px}
.pr s{color:var(--mut);font-size:13px}
.pr i{font-style:normal;color:var(--pk);font-weight:700;font-size:13px}
.ci small{color:var(--mut)}
.fs{background:var(--pkl)}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.row .card{flex:0 0 168px;scroll-snap-align:start}
.cd{display:flex;gap:6px;align-items:center;font-size:14px;margin-top:4px}
.cd b{background:var(--pk);color:#fff;border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font:500 14px Figtree,sans-serif;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.back{display:inline-block;margin-bottom:14px;color:var(--g);font-weight:700}
.pd{display:grid;gap:24px}
@media(min-width:760px){.pd{grid-template-columns:1fr 1fr;gap:40px}}
.pd .im{border-radius:18px}
.pd h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:4px 0 10px}
.pd .pr b{font-size:28px}
.lb{font:700 15px Figtree,sans-serif;margin:18px 0 8px}
.sz{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sz button{min-width:46px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:600 15px Figtree,sans-serif;cursor:pointer}
.sz button.on{border-color:var(--g);background:var(--g);color:#fff}
.pd .btn{width:100%;max-width:360px}
.desc{max-width:60ch}
footer{background:var(--gd);color:#fff;padding:28px 0;margin-top:24px}
footer .wrap{display:flex;align-items:center;gap:12px;font-size:14px}
footer .lg{background-image:var(--mw)}
dialog{border:0;border-radius:18px;padding:24px;width:min(400px,92vw);margin:auto;color:var(--ink)}
dialog::backdrop{background:rgba(6,56,43,.55)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:0;border-radius:10px;background:var(--bg);font:700 15px Figtree,sans-serif;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
label{display:block;font-size:14px;font-weight:500;margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:16px Figtree,sans-serif}
#msg{min-height:20px;font-size:14px;color:var(--pk);margin-bottom:8px}
#msg.ok{color:var(--g)}
#note{font-size:14px;margin-bottom:12px}
.fa{display:flex;gap:8px}
.fa .btn{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50}
</style>
</head>

<div id="demo" class="demo" hidden></div>
<header><div class="wrap top">
<a class="brand" href="#/"><span class="lg"></span>JIYORA</a>
<nav id="nav"><a href="#/" data-r="">Beranda</a><a href="#/produk" data-r="produk">Produk</a><a href="#/terlaris" data-r="terlaris">Terlaris</a><a href="#/flash-sale" data-r="flash-sale">Flash sale</a></nav>
<div class="acct" id="acct"></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><span class="lg"></span><span>JIYORA, fashion wanita sehari-hari. &copy; <span id="yr"></span></span></div></footer>

<dialog id="authd"><form id="af">
<div class="tabs"><button type="button" data-mode="masuk">Masuk</button><button type="button" data-mode="daftar">Daftar</button></div>
<p id="note" class="mut" hidden></p>
<label id="nml">Nama lengkap<input id="nm" autocomplete="name"></label>
<label>Email<input id="em" type="email" autocomplete="email" required></label>
<label>Kata sandi<input id="pw" type="password" minlength="6" required></label>
<p id="msg" role="alert"></p>
<div class="fa"><button class="btn" id="go">Masuk</button><button type="button" class="btn o" id="cl">Batal</button></div>
</form></dialog>
<div id="toast" hidden></div>

const soon=h=>new Date(Date.now()+h*36e5).toISOString();
let sb=null,P=[],user=null,cat='Semua',size=null,mode='masuk';

const DEMO=[['Blus Linen Naya','Atasan',129000,89000,312],['Rok Plisket Sora','Bawahan',119000,0,268],['Dress Midi Kinara','Dress',199000,149000,254],['Kemeja Oversize Alma','Atasan',139000,0,201],['Kulot Wide Raya','Bawahan',149000,109000,187],['Outer Rajut Mira','Outer',179000,0,143],['Dress Satin Livia','Dress',229000,0,96],['Cardigan Crop Tara','Outer',159000,0,74]]
.map(([name,category,price,fp,sold],i)=>({id:'d'+i,name,category,price,flash_price:fp||null,flash_end:fp?soon(6):null,sold,stock:20+i*3,sizes:['S','M','L','XL'],description:'Bahan nyaman, jatuh rapi di badan, mudah dipadukan untuk kerja maupun santai. (Produk contoh)'}));

const isFlash=p=>p.flash_price&&p.flash_end&&new Date(p.flash_end)>Date.now();
const cur=p=>isFlash(p)?p.flash_price:p.price;
const pct=p=>Math.round(100-p.flash_price/p.price*100);
const hue=p=>[150,340,25,170,200,45][[...String(p.name)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
const best=()=>[...P].sort((a,b)=>(b.sold||0)-(a.sold||0));

function img(p,rank){
  const t=rank?`<span class="tag r">#${rank} terlaris</span>`:isFlash(p)?`<span class="tag">-${pct(p)}%</span>`:'';
  return p.image_url?`<div class="im"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">${t}</div>`:`<div class="im ph" style="--h:${hue(p)}">${t}</div>`;
}
const price=p=>`<div class="pr"><b>${rp(cur(p))}</b>${isFlash(p)?`<s>${rp(p.price)}</s><i>-${pct(p)}%</i>`:''}</div>`;
const card=(p,rank)=>`<a class="card" href="#/produk/${esc(p.id)}">${img(p,rank)}<div class="ci"><h3>${esc(p.name)}</h3>${price(p)}<small>${p.sold||0} terjual</small></div></a>`;
const cards=(a,r)=>a.map((p,i)=>card(p,r&&i<3?i+1:0)).join('');
const empty=t=>`<p class="mut">${t}</p>`;
const sec=(t,link,body)=>`<section><div class="wrap"><div class="sh"><h2>${t}</h2>${link?`<a href="${link}">Lihat semua</a>`:''}</div>${body}</div></section>`;
const flashSec=(f,row)=>`<section class="fs"><div class="wrap"><div class="sh"><div><h2>Flash sale</h2><div class="cd"></div></div>${row?'<a href="#/flash-sale">Lihat semua</a>':''}</div><div class="${row?'row':'grid'}">${cards(f)}</div></div></section>`;

function home(){
  const f=P.filter(isFlash);
  return `<div class="hero"><div class="wrap"><h1>Pakaian wanita yang nyaman dari pagi sampai malam.</h1><p>Koleksi JIYORA dipilih untuk dipakai setiap hari: bahan adem, potongan rapi, harga masuk akal.</p><div class="acts"><a class="btn" href="#/produk">Belanja sekarang</a><a class="btn o" href="#/flash-sale">Lihat flash sale</a></div></div></div>`
  +(f.length?flashSec(f.slice(0,8),true):'')
  +sec('Produk terlaris','#/terlaris',P.length?`<div class="grid">${cards(best().slice(0,4),1)}</div>`:empty('Belum ada produk.'))
  +sec('Produk terbaru','#/produk',P.length?`<div class="grid">${cards(P.slice(0,8))}</div>`:'');
}
function listing(){
  const cats=['Semua',...new Set(P.map(p=>p.category).filter(Boolean))];
  const items=cat==='Semua'?P:P.filter(p=>p.category===cat);
  return sec('Semua produk','',`<div class="chips">${cats.map(c=>`<button class="${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>${items.length?`<div class="grid">${cards(items)}</div>`:empty('Belum ada produk di kategori ini.')}`);
}
const terlaris=()=>sec('Produk terlaris','',P.length?`<div class="grid">${cards(best(),1)}</div>`:empty('Belum ada produk.'));
function flash(){
  const f=P.filter(isFlash);
  return f.length?flashSec(f,false):sec('Flash sale','',empty('Belum ada flash sale saat ini. Cek lagi nanti.'));
}
function detail(id){
  const p=P.find(x=>String(x.id)===id);
  if(!p)return sec('Produk tidak ditemukan','',`<a class="btn" href="#/produk">Lihat semua produk</a>`);
  size=null;
  const sz=p.sizes||[],out=!(p.stock>0);
  return `<section><div class="wrap"><a class="back" href="#/produk">&lsaquo; Semua produk</a><div class="pd">${img(p)}<div><p class="mut">${esc(p.category)}</p><h1>${esc(p.name)}</h1>${price(p)}${isFlash(p)?'<div class="cd"></div>':''}<p class="mut" style="margin-top:6px">${p.sold||0} terjual, stok ${p.stock||0}</p>${sz.length?`<h3 class="lb">Ukuran</h3><div class="sz">${sz.map(s=>`<button data-sz="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:'<div style="height:18px"></div>'}<button class="btn" data-buy="${esc(p.id)}" ${out?'disabled':''}>${out?'Stok habis':'Beli di Shopee'}</button><h3 class="lb">Deskripsi</h3><p class="desc">${esc(p.description)||'Belum ada deskripsi.'}</p></div></div></div></section>`;
}

function render(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
  $('#app').innerHTML=a==='produk'&&b?detail(b):a==='produk'?listing():a==='terlaris'?terlaris():a==='flash-sale'?flash():home();
  $$('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.r===(a||'')));
  tick();
}
function route(){window.scrollTo(0,0);render()}

function tick(){
  const els=$$('.cd'),f=P.filter(isFlash);
  if(!els.length)return;
  if(!f.length){els.forEach(e=>e.textContent='');return}
  const s=Math.max(0,Math.floor((Math.min(...f.map(p=>+new Date(p.flash_end)))-Date.now())/1000));
  const t=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0'));
  els.forEach(e=>e.innerHTML=`<span>Berakhir dalam</span><b>${t[0]}</b>:<b>${t[1]}</b>:<b>${t[2]}</b>`);
}
setInterval(tick,1000);

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

async function load(){
  const d=$('#demo');
  if(sb){
    const {data,error}=await sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false});
    if(!error&&data){P=data;return}
    console.warn(error);d.textContent='Produk gagal dimuat dari Supabase. Pastikan tabel products sudah dibuat (jalankan jiyora-supabase.sql). Menampilkan produk contoh.';
  }else d.textContent='Mode contoh: produk di bawah adalah data demo. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file ini untuk memakai data asli.';
  d.hidden=false;P=DEMO;
}

/* ---------- Akun pembeli ---------- */
function acct(){
  const a=$('#acct');
  if(user){
    const n=(user.user_metadata?.full_name||user.email.split('@')[0]).split(' ')[0];
    a.innerHTML=`<span>Halo, ${esc(n)}</span><button class="btn o sm" data-out>Keluar</button>`;
  }else a.innerHTML='<button class="btn o sm" data-open="masuk">Masuk</button><button class="btn sm" data-open="daftar">Daftar</button>';
}
function setMode(m){
  mode=m;
  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('#nml').hidden=m==='masuk';$('#nm').required=m==='daftar';
  $('#pw').autocomplete=m==='daftar'?'new-password':'current-password';
  $('#go').textContent=m==='daftar'?'Buat akun':'Masuk';
  msg('');
}
function msg(t,ok){const e=$('#msg');e.textContent=t;e.className=ok?'ok':''}
function openAuth(m,note){
  setMode(m);const n=$('#note');n.textContent=note||'';n.hidden=!note;
  $('#authd').showModal();
}
const tr=m=>({'Invalid login credentials':'Email atau kata sandi salah.','Email not confirmed':'Email belum dikonfirmasi. Cek kotak masuk Anda.','User already registered':'Email ini sudah terdaftar. Silakan masuk.'}[m]||(/password/i.test(m)?'Kata sandi minimal 6 karakter.':/rate limit/i.test(m)?'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.':m));

$('#af').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!sb)return msg('Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas file dulu.');
  const email=$('#em').value.trim(),password=$('#pw').value,btn=$('#go');
  btn.disabled=true;msg('');
  try{
    if(mode==='daftar'){
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$('#nm').value.trim()}}});
      if(error)msg(tr(error.message));
      else if(!data.session)msg('Akun dibuat. Cek email Anda untuk konfirmasi, lalu masuk.',true);
      else{$('#authd').close();toast('Akun berhasil dibuat')}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)msg(tr(error.message));else{$('#authd').close();toast('Berhasil masuk')}
    }
  }catch(err){msg('Tidak bisa terhubung ke Supabase. Periksa koneksi dan URL proyek.')}
  btn.disabled=false;
});
$('#cl').onclick=()=>$('#authd').close();

function buy(id){
  const p=P.find(x=>String(x.id)===id);
  if(!user)return openAuth('masuk','Masuk dulu untuk membeli.');
  if((p.sizes||[]).length&&!size)return toast('Pilih ukuran dulu');
  if(p.shopee_url)window.open(p.shopee_url,'_blank','noopener');else toast('Link pembelian produk ini belum diisi.');
}

document.addEventListener('click',async e=>{
  const t=e.target,q=s=>t.closest(s);
  if(q('[data-cat]')){cat=q('[data-cat]').dataset.cat;render()}
  else if(q('[data-sz]')){size=q('[data-sz]').dataset.sz;$$('[data-sz]').forEach(x=>x.classList.toggle('on',x.dataset.sz===size))}
  else if(q('[data-buy]'))buy(q('[data-buy]').dataset.buy);
  else if(q('[data-open]'))openAuth(q('[data-open]').dataset.open);
  else if(q('[data-out]')){await sb?.auth.signOut();toast('Anda sudah keluar')}
  else if(q('[data-mode]'))setMode(q('[data-mode]').dataset.mode);
});

(async()=>{
  const r=document.documentElement.style;
  r.setProperty('--mg',`url(${MARK_G})`);r.setProperty('--mw',`url(${MARK_W})`);
  $('link[rel=icon]').href=MARK_G;$('#yr').textContent=new Date().getFullYear();
  if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  $('#app').innerHTML='<div class="wrap" style="padding:48px 16px"><p class="mut">Memuat produk...</p></div>';
  if(sb){
    try{const {data}=await sb.auth.getSession();user=data.session?.user||null}catch(e){}
    sb.auth.onAuthStateChange((_,s)=>{user=s?.user||null;acct()});
  }
  acct();await load();route();
  addEventListener('hashchange',route);
})();
</script>
</body>
</html>
